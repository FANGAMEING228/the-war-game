<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>THE WAR — FPV & GROUND COMBAT</title>
<meta name="theme-color" content="#14150f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#14150f; --panel:#1c1e15; --panel2:#22241a; --line:#3a3d2b;
  --ink:#d6d2bf; --dim:#8b8873; --amber:#d99a2b; --red:#b23c2e; --olive:#6b7042;
  --mono:'Share Tech Mono',monospace; --stencil:'Black Ops One',sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--mono)}
button{font-family:var(--mono);cursor:pointer}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column}
.hidden{display:none!important}
.overlay{background:rgba(15,16,10,.86)}
/* ---------- boot ---------- */
#boot{background:#101109;align-items:center;justify-content:center;z-index:60}
.bootbox{text-align:center}
.bootbox h1{font-family:var(--stencil);font-size:64px;letter-spacing:.06em;color:var(--ink)}
.bootbox h1 b{color:var(--amber);font-weight:400}
.bootbar{width:280px;height:3px;background:#2a2c1f;margin:26px auto 14px}
.bootbar i{display:block;height:100%;width:5%;background:var(--amber);transition:width .3s}
.bootbox p{font-size:11px;letter-spacing:.3em;color:var(--dim)}
/* ---------- mode gate ---------- */
#gate{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 90% 70% at 50% 30%, rgba(30,26,18,.94) 0%, rgba(10,10,7,.99) 75%),#0d0e09}
.gate-box{text-align:center;max-width:900px;padding:20px}
.gate-box h1{font-family:var(--stencil);font-size:clamp(48px,9vw,92px);letter-spacing:.05em;line-height:1;color:var(--ink)}
.gate-box h1 b{color:var(--amber);font-weight:400}
.gate-sub{font-size:11px;letter-spacing:.34em;color:var(--dim);margin:14px 0 40px}
.gate-cards{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.gate-cards button{flex:1;min-width:280px;max-width:400px;background:rgba(28,30,21,.6);border:1px solid var(--line);
  color:var(--ink);text-align:left;padding:22px 24px;display:flex;flex-direction:column;gap:8px;
  transition:border-color .15s,background .15s}
.gate-cards button:hover{border-color:var(--amber);background:rgba(217,154,43,.07)}
.g-idx{font-size:10px;letter-spacing:.3em;color:var(--dim)}
.g-name{font-family:var(--stencil);font-size:24px;letter-spacing:.08em;color:var(--amber)}
.g-desc{font-size:11px;line-height:1.7;color:#b9b5a2;letter-spacing:.06em}
.gate-note{margin-top:34px;font-size:10px;letter-spacing:.22em;color:var(--dim)}
/* ---------- main menu ---------- */
#main{justify-content:space-between}
.masthead{padding:40px 56px 0}
.masthead h1{font-family:var(--stencil);font-size:clamp(44px,7vw,80px);letter-spacing:.05em;line-height:1}
.masthead h1 b{color:var(--amber);font-weight:400}
.mastmeta{font-size:11px;letter-spacing:.28em;color:var(--dim);margin-top:10px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.mastmeta em{font-style:normal;color:var(--amber)}
.menucols{flex:1;display:flex;gap:48px;padding:26px 56px;min-height:0}
.modenav{display:flex;flex-direction:column;gap:4px;width:400px}
.modenav button{text-align:left;background:none;border:none;border-left:3px solid transparent;
  padding:13px 18px;color:var(--ink);font-size:19px;letter-spacing:.14em;transition:all .15s}
.modenav button .idx{color:var(--dim);font-size:11px;width:30px;display:inline-block}
.modenav button em{display:block;font-style:normal;font-size:11px;letter-spacing:.2em;color:var(--dim);margin-top:4px}
.modenav button:hover{border-left-color:var(--amber);background:rgba(214,210,191,.05);padding-left:26px}
.briefing{flex:1;max-width:470px;border:1px solid var(--line);background:var(--panel);padding:26px 30px;display:flex;flex-direction:column}
.briefhead{font-size:10px;letter-spacing:.3em;color:var(--dim)}
.briefing h2{font-family:var(--stencil);font-size:26px;letter-spacing:.08em;margin:10px 0 0}
.briefing .rule{width:44px;height:3px;background:var(--amber);margin:12px 0 16px}
.briefing p{font-size:13px;line-height:1.75;color:#b9b5a2}
.ctrltable{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:11px;color:var(--dim);letter-spacing:.08em}
.ctrltable span{color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);padding:1px 6px;margin-right:8px}
.statusstrip{display:flex;gap:32px;padding:14px 56px;border-top:1px solid var(--line);font-size:11px;letter-spacing:.16em;color:var(--dim);flex-wrap:wrap}
.statusstrip .on{color:var(--amber)}
.subhead{display:flex;align-items:center;gap:22px;padding:34px 56px 20px;border-bottom:1px solid var(--line)}
.subhead h1{font-family:var(--stencil);font-size:34px;letter-spacing:.08em}
.backbtn{background:none;border:1px solid var(--line);color:var(--dim);font-size:12px;letter-spacing:.2em;padding:9px 16px}
.backbtn:hover{border-color:var(--amber);color:var(--amber)}
.subbody{flex:1;padding:30px 56px;overflow:auto}
/* ---------- loadout ---------- */
.loadcols{display:flex;gap:44px;max-width:1000px}
.partscol{flex:1.25}
.partrow{margin-bottom:22px}
.partrow h3{font-size:11px;letter-spacing:.28em;color:var(--dim);margin-bottom:9px}
.segb{display:flex;flex-wrap:wrap;gap:6px}
.segb button{background:none;border:1px solid var(--line);color:var(--ink);font-size:12px;letter-spacing:.12em;padding:7px 13px}
.segb button small{display:block;color:var(--dim);font-size:10px;margin-top:3px;letter-spacing:.04em}
.segb button.on{border-color:var(--amber);color:var(--amber);background:rgba(217,154,43,.07)}
.statcol{flex:1;border:1px solid var(--line);background:var(--panel);padding:24px 26px;align-self:flex-start}
.statcol h3{font-size:11px;letter-spacing:.28em;color:var(--amber);margin-bottom:18px}
.statbar{margin-bottom:14px}
.statbar span{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;color:var(--dim)}
.statbar span b{color:var(--ink);font-weight:400}
.statbar .tr{height:4px;background:#2a2c1f;margin-top:5px}
.statbar .tr i{display:block;height:100%;background:var(--olive)}
/* ---------- settings ---------- */
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px;max-width:1100px}
.setgroup h3{font-size:11px;letter-spacing:.3em;color:var(--amber);border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:14px}
.field{display:block;margin:13px 0}
.field>span{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.16em;color:var(--dim)}
.field>span b{color:var(--amber);font-weight:400}
.field input[type=range]{width:100%;accent-color:var(--amber);margin-top:6px}
.check{display:flex;align-items:center;gap:10px;margin:13px 0;font-size:11px;letter-spacing:.16em;color:var(--dim);cursor:pointer}
.check input{accent-color:var(--amber);width:15px;height:15px}
.textin{background:#0e0f0a;border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:13px;letter-spacing:.14em;padding:9px 12px;width:100%}
.textin:focus{outline:none;border-color:var(--amber)}
#stickviz{border:1px solid var(--line);background:#0e0f0a;display:block;margin-top:8px}
#customtag{font-size:10px;letter-spacing:.24em;color:var(--red);margin-left:12px}
/* ---------- multiplayer ---------- */
.mpcols{display:flex;gap:44px;max-width:1000px}
.mpcol{flex:1}
.mpcol h3{font-size:11px;letter-spacing:.28em;color:var(--dim);margin-bottom:12px}
.btn{background:none;border:1px solid var(--amber);color:var(--amber);font-size:13px;letter-spacing:.22em;padding:11px 22px}
.btn:hover{background:var(--amber);color:#14150f}
.btn.sec{border-color:var(--line);color:var(--ink)}
.btn.sec:hover{background:rgba(214,210,191,.08);color:var(--ink)}
#mp-code{font-size:22px;letter-spacing:.5em;text-transform:uppercase;text-align:center;margin-top:10px}
#mp-note{font-size:11px;color:var(--dim);letter-spacing:.08em;line-height:1.7;margin-top:16px;max-width:360px}
#lobby{border:1px solid var(--line);background:var(--panel);padding:22px 26px;flex:1}
#lobby h3{font-size:11px;letter-spacing:.28em;color:var(--amber);margin-bottom:6px}
#mp-roomcode{font-family:var(--stencil);font-size:38px;color:var(--amber);letter-spacing:.2em;margin:6px 0 14px}
#mp-roster{font-size:13px;letter-spacing:.12em}
#mp-roster div{padding:6px 0;border-bottom:1px solid #26281c;color:var(--ink)}
#mp-roster div i{font-style:normal;color:var(--dim);font-size:10px;letter-spacing:.2em;float:right}
#mp-status{font-size:11px;color:var(--dim);letter-spacing:.14em;margin-top:12px;min-height:16px}
#mp-mode{margin:16px 0}
/* ---------- pause / end ---------- */
.centercol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.centercol h1{font-family:var(--stencil);font-size:46px;letter-spacing:.1em}
.centercol .sub{font-size:12px;letter-spacing:.3em;color:var(--amber)}
.btnrow{display:flex;gap:14px;margin-top:20px}
#endstats{margin-top:22px;min-width:340px}
#endstats div{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.14em;padding:8px 2px;border-bottom:1px solid #26281c}
#endstats div span:last-child{color:var(--amber)}
/* ---------- soldier HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;font-family:var(--mono);color:#e6e2cf}
#compass{position:absolute;top:14px;left:50%;transform:translateX(-50%)}
#objective{position:absolute;top:62px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:.28em;color:var(--amber)}
#radar{position:absolute;top:14px;right:18px;border:1px solid rgba(230,226,207,.28);border-radius:50%}
#killfeed{position:absolute;top:18px;left:18px;font-size:11px;letter-spacing:.1em;color:#cfcbb8}
#killfeed div{margin:3px 0;transition:opacity 1s}
#crosshair{position:absolute;left:50%;top:50%;--gap:10px}
#crosshair i{position:absolute;background:#e6e2cf;box-shadow:0 0 2px rgba(0,0,0,.7)}
#crosshair .t{width:2px;height:9px;left:-1px;top:calc(-1 * var(--gap) - 9px)}
#crosshair .b{width:2px;height:9px;left:-1px;top:var(--gap)}
#crosshair .l{width:9px;height:2px;top:-1px;left:calc(-1 * var(--gap) - 9px)}
#crosshair .r{width:9px;height:2px;top:-1px;left:var(--gap)}
#crosshair .c{width:2px;height:2px;left:-1px;top:-1px}
#hitmarker{position:absolute;left:50%;top:50%;opacity:0;transition:opacity .2s}
#hitmarker i{position:absolute;width:2px;height:8px;background:#e6e2cf}
#hitmarker i:nth-child(1){transform:translate(-8px,-12px) rotate(-45deg)}
#hitmarker i:nth-child(2){transform:translate(6px,-12px) rotate(45deg)}
#hitmarker i:nth-child(3){transform:translate(-8px,4px) rotate(45deg)}
#hitmarker i:nth-child(4){transform:translate(6px,4px) rotate(-45deg)}
#hitmarker.show{opacity:1;transition:none}
#hitmarker.kill i{background:var(--red)}
#hpbox{position:absolute;left:22px;bottom:22px}
#hpbox .lab{font-size:10px;letter-spacing:.3em;color:var(--dim)}
#hpbar{width:190px;height:5px;border:1px solid rgba(230,226,207,.35);margin-top:5px}
#hpbar i{display:block;height:100%;width:100%;background:#cfccb9}
#hpbar.low i{background:var(--red)}
#hpnum{font-size:13px;letter-spacing:.14em;margin-top:4px;color:#cfccb9}
#ammobox{position:absolute;right:22px;bottom:22px;text-align:right}
#ammobox .lab{font-size:10px;letter-spacing:.3em;color:var(--dim)}
#ammomag{font-size:38px;letter-spacing:.06em;line-height:1.1}
#ammores{font-size:14px;color:var(--dim);letter-spacing:.14em}
#reloadhint{font-size:11px;letter-spacing:.3em;color:var(--amber);visibility:hidden;animation:blink 1s steps(2) infinite}
#heatwrap{position:absolute;right:22px;bottom:22px;text-align:right}
#heatwrap .lab{font-size:10px;letter-spacing:.3em;color:var(--dim)}
#heatbar{width:190px;height:6px;border:1px solid rgba(230,226,207,.35);margin:5px 0 4px}
#heatbar i{display:block;height:100%;width:0;background:var(--amber)}
#chasemeta{position:absolute;left:22px;bottom:22px;font-size:12px;letter-spacing:.2em;color:#cfccb9;line-height:1.9}
#vign{position:absolute;inset:0;box-shadow:inset 0 0 140px 40px rgba(160,30,18,.85);opacity:0}
#banner{position:absolute;top:24%;width:100%;text-align:center;opacity:0;transition:opacity .5s}
#banner .bt{font-family:var(--stencil);font-size:34px;letter-spacing:.3em;color:var(--ink)}
#banner .bs{font-size:12px;letter-spacing:.34em;color:var(--amber);margin-top:8px}
#toasts{position:absolute;bottom:88px;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
#toasts div{background:rgba(20,21,15,.9);border:1px solid var(--line);padding:8px 18px;font-size:12px;letter-spacing:.14em;transition:opacity .6s}
#prompt{position:absolute;top:58%;width:100%;text-align:center;font-size:13px;letter-spacing:.34em;color:var(--amber);animation:blink 1.4s steps(2) infinite;pointer-events:none}
#downoverlay{position:absolute;top:40%;width:100%;text-align:center;font-family:var(--stencil);font-size:26px;letter-spacing:.2em;color:var(--red)}
#nettag{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.24em;color:var(--dim)}
#scopeovl{position:absolute;left:50%;top:50%;width:64vmin;height:64vmin;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 0 0 200vmax rgba(8,8,6,.96);display:none}
#scopeovl::before,#scopeovl::after{content:'';position:absolute;background:rgba(230,226,207,.55)}
#scopeovl::before{left:50%;top:6%;bottom:6%;width:1px}
#scopeovl::after{top:50%;left:6%;right:6%;height:1px}
@keyframes blink{50%{opacity:.25}}
/* ---------- FPV MODE ---------- */
#fpvwrap{position:fixed;inset:0;z-index:40;display:none;background:#14150f}
#fpvwrap.on{display:block}
#fpvgl,#fpvosd{position:absolute;inset:0;width:100%;height:100%}
#fpvosd{pointer-events:none}
.fpv-ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,16,10,.85)}
.fpv-ov.on{display:flex}
.fpv-box{background:#1c1e15;border:1px solid #3a3d2b;padding:30px 38px;min-width:320px;max-width:460px;font-family:'Share Tech Mono',monospace;color:#d6d2bf;text-align:center}
.fpv-box h2{font-size:22px;letter-spacing:.25em;color:#d9a52b;margin-bottom:18px}
.fpv-sub{font-size:11px;letter-spacing:.2em;color:#8b8873;margin:-10px 0 16px}
.fpv-col{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.fpv-btn{background:none;border:1px solid #d9a52b;color:#d9a52b;font-family:inherit;font-size:13px;letter-spacing:.2em;padding:10px 18px;cursor:pointer}
.fpv-btn:hover{background:#d9a52b;color:#14150f}
.fpv-btn.sec{border-color:#3a3d2b;color:#d6d2bf}
.fpv-btn.sec:hover{background:rgba(214,210,191,.1);color:#d6d2bf}
.fpv-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:12px 0;font-size:11px;letter-spacing:.15em;color:#8b8873}
.fpv-row input[type=range]{accent-color:#d9a52b;width:150px}
.fpv-row b{color:#d9a52b}
.fpv-row label{cursor:pointer;display:flex;gap:8px;align-items:center}
.fpv-row input[type=checkbox]{accent-color:#d9a52b}
.fpv-seg{display:flex;gap:6px}
.fpv-seg button{background:none;border:1px solid #3a3d2b;color:#d6d2bf;font-family:inherit;font-size:11px;letter-spacing:.1em;padding:5px 10px;cursor:pointer}
.fpv-seg button.on{border-color:#d9a52b;color:#d9a52b}
.fpv-hint{margin-top:16px;font-size:9px;letter-spacing:.14em;color:#8b8873;line-height:1.9}
#fpv-stats{text-align:left;margin:6px 0 14px}
#fpv-stats div{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em;padding:6px 2px;border-bottom:1px solid #26281c}
#fpv-stats div span:last-child{color:#d9a52b}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<noscript><div style="position:fixed;inset:0;background:#101109;color:#d99a2b;display:flex;align-items:center;justify-content:center;font-family:monospace;letter-spacing:.2em">ENABLE JAVASCRIPT TO RUN THE WAR</div></noscript>

<!-- ============ BOOT ============ -->
<div id="boot" class="screen">
  <div class="bootbox">
    <h1>THE <b>WAR</b></h1>
    <div class="bootbar"><i id="bootfill"></i></div>
    <p id="bootmsg">INITIALIZING COMBAT SYSTEMS</p>
  </div>
</div>

<!-- ============ MODE GATE ============ -->
<div id="gate">
  <div class="gate-box">
    <h1>THE <b>WAR</b></h1>
    <div class="gate-sub">FPV DRONES + GROUND COMBAT · ONE FILE</div>
    <div class="gate-cards">
      <button id="gateFpv">
        <span class="g-idx">MODE 01</span>
        <span class="g-name">FPV DRONE MODE</span>
        <span class="g-desc">Fly a quad from the pilot's seat — angle or full acro flight, live OSD, bomb runs on 50 marked targets, battery management, crash physics. Gamepad Mode-2 or keyboard.</span>
      </button>
      <button id="gateSoldier">
        <span class="g-idx">MODE 02</span>
        <span class="g-name">SOLDIER MODE</span>
        <span class="g-desc">Ground combat — Searcher (sweep 50 hostiles), Car Chase rear-gunner, rifle loadout from parts, potato-proof settings and P2P multiplayer.</span>
      </button>
    </div>
    <div class="gate-note">SWITCH MODES ANYTIME FROM THE IN-GAME MENU · DIRECT LINKS: #fpv / #soldier</div>
  </div>
</div>

<!-- watchdog: never a silent hang -->
<script>
setTimeout(function(){
  if(!window.__THEWAR_LOADED__){
    var g=document.getElementById('gate');
    if(g){
      g.innerHTML='<div style="color:#b23c2e;font-family:monospace;letter-spacing:.15em;font-size:14px;text-align:center">SCRIPT FAILED TO LOAD — PRESS F12 FOR DETAILS</div>';
    }else{
      var m=document.getElementById('bootmsg');
      if(m){m.textContent='STILL LOADING — SLOW OR BLOCKED CDN, TRYING MIRRORS…';m.style.color='#d99a2b'}
    }
  }
},15000);
</script>

<script type="module">
window.__THEWAR_LOADED__=true;
/* ============ SHARED CORE ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const D2R=Math.PI/180;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genCode(){const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=c[Math.random()*c.length|0];return s}
function bootStep(pct,msg){const f=$('#bootfill'),m=$('#bootmsg');if(f)f.style.width=pct+'%';if(msg&&m)m.textContent=msg}
function bootFail(msg){
  if(window.__THEWAR_STATE__)return;
  window.__THEWAR_STATE__='fail';
  const g=document.getElementById('gate');if(g)g.remove();
  bootStep(100,'');
  const f=$('#bootfill');if(f)f.style.background='#b23c2e';
  const m=$('#bootmsg');
  if(m){m.textContent=msg;m.style.color='#b23c2e';m.style.letterSpacing='.12em'}
  const host=document.querySelector('.bootbox')||document.body;
  const b=document.createElement('button');
  b.className='btn';b.textContent='RETRY';b.style.marginTop='20px';
  b.onclick=()=>location.reload();
  host.appendChild(b);
}
addEventListener('error',e=>{if(!window.__THEWAR_STATE__)bootFail('ERROR: '+(e.message||'unknown'))});
addEventListener('unhandledrejection',e=>{if(!window.__THEWAR_STATE__)bootFail('ERROR: '+((e.reason&&e.reason.message)||'rejected promise'))});
function withTimeout(p,ms,label){
  return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout '+label)),ms))]);
}
/* shared three.js loader — mirror chain, cached, works offline with a local three.module.js */
let THREE=null,threeLoading=null;
const THREE_URLS=[
  './three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js',
  'https://unpkg.com/three@0.160.1/build/three.module.js',
  'https://esm.sh/three@0.160.1',
  'https://cdn.skypack.dev/three@0.160.1'
];
function loadThree(onStep){
  if(threeLoading)return threeLoading;
  threeLoading=(async()=>{
    for(let i=0;i<THREE_URLS.length;i++){
      const url=THREE_URLS[i];

      if(pos.x>b.minx-.22&&pos.x<b.maxx+.22&&pos.y<b.maxy+.22&&pos.y>b.miny-.22&&pos.z>b.minz-.22&&pos.z<b.maxz+.22)
        return crash('COLLIDED WITH STRUCTURE');
    if(gameType==='bomber'){
      batt=Math.max(0,batt-(0.5+thr*1.05)*dt*(100/170));
      if(batt<=0&&!battDead){battDead=true;arm=false;osdMsg('BATTERY DEAD — GLIDE DOWN')}
      if(battDead&&pos.y<=.11&&vel.length()<.5){
        groundedT+=dt;
        if(groundedT>1.5&&!ended){ended=true;showEnd(false,'BATTERY DEPLETED','The pack ran dry behind enemy lines.')}
      }else groundedT=0;
    }else{batt=100;battDead=false}
    topSpd=Math.max(topSpd,vel.length()*3.6);
    time+=dt;
    droneG.position.copy(pos);
    for(const pr of props)pr.rotation.y+=(6+thr*55)*dt*pr.userData.d;
    camera.position.set((Math.random()-.5)*shake*.06,.04+(Math.random()-.5)*shake*.06,.12);
    camera.rotation.set(P.tilt*D2R,0,(Math.random()-.5)*shake*.05);
    shake=Math.max(0,shake-dt*1.1);
    if(AC){
      const f=75+thr*250+vel.length()*1.5;
      mGain.gain.value=arm?(.012+thr*.06):.006;
      osc1.frequency.value=f;osc2.frequency.value=f*1.01+3;
      windGain.gain.value=clamp(vel.length()/38,0,.16);
    }
    dropCd=Math.max(0,dropCd-dt);
    if(wantDrop){
      wantDrop=false;
      if(gameType==='bomber'&&arm&&!dead&&!ended&&dropCd<=0){dropCd=.6;dropBomb()}
    }
    updateBombs(dt);
  }
  /* ---------- OSD ---------- */
  function toScreen(p){
    tmpV.copy(p).project(camera);
    if(tmpV.z>1||Math.abs(tmpV.x)>1.1||Math.abs(tmpV.y)>1.1)return false;
    out.x=(tmpV.x*.5+.5)*osdW;out.y=(-tmpV.y*.5+.5)*osdH;
    return true;
  }
  function drawOSD(dt){
    camera.updateMatrixWorld();
    const osd=$('#fpvosd');if(!osd)return;
    const o=osd.getContext('2d');
    osdW=osd.width;osdH=osd.height;
    if(!osdW||!osdH)return;
    o.clearRect(0,0,osdW,osdH);
    const fs=Math.max(12,Math.round(osdH/46));
    const white='rgba(240,255,240,.95)',amber='#d9a52b',red='#e04a38';
    o.font=fs+'px "Share Tech Mono",monospace';
    o.textBaseline='middle';
    o.shadowColor='rgba(0,0,0,.85)';o.shadowOffsetX=1;o.shadowOffsetY=1;
    camera.getWorldQuaternion(tmpQ);
    const e=tmpE.setFromQuaternion(tmpQ,'YXZ');
    const heading=((-e.y/D2R)%360+360)%360;
    const cx=osdW/2;
    o.fillStyle=white;
    o.textAlign='left';o.fillText('THE WAR // FPV',14,fs);
    o.textAlign='right';
    const volts=(16.8-(100-batt)/100*2.8-thr*.35).toFixed(1);
    o.fillText(gameType==='bomber'?volts+'V  '+Math.ceil(batt)+'%':'FREE FLIGHT',osdW-14,fs);
    const pxPerDeg=osdW*.8/90,tapeY=fs*1.9;
    for(let a=Math.floor((heading-45)/5)*5;a<=heading+45;a+=5){
      const x=cx+(a-heading)*pxPerDeg,na=((a%360)+360)%360;
      if(na%90===0){
        o.fillStyle=white;o.textAlign='center';
        o.fillText({0:'N',90:'E',180:'S',270:'W'}[na],x,tapeY-fs*.8);
        o.fillRect(x-1,tapeY,2,fs*.7);
      }else{o.fillStyle='rgba(240,255,240,.4)';o.fillRect(x-.5,tapeY,1,fs*.4)}
    }
    o.fillStyle=white;o.textAlign='center';
    o.fillRect(cx-1,tapeY-fs*.3,2,fs);
    o.fillText(String(Math.round(heading)).padStart(3,'0'),cx,tapeY+fs*1.4);
    if(gameType==='bomber'){
      let nt=null,nd=1e9;
      for(const t of targets)if(!t.dead){const d=t.pos.distanceTo(pos);if(d<nd){nd=d;nt=t}}
      if(nt){
        const brg=(Math.atan2(nt.pos.x-pos.x,-(nt.pos.z-pos.z))*180/Math.PI+360)%360;
        let dd=brg-heading;while(dd>180)dd-=360;while(dd<-180)dd+=360;
        const x=cx+clamp(dd,-44,44)*pxPerDeg;
        o.fillStyle=amber;
        o.beginPath();o.moveTo(x,tapeY-fs*.2);o.lineTo(x+5,tapeY+fs*.5);
        o.lineTo(x,tapeY+fs*1.1);o.lineTo(x-5,tapeY+fs*.5);o.closePath();o.fill();
        if(Math.abs(dd)>44){o.fillStyle=amber;o.textAlign='left';
          o.fillText(dd>0?'▶':'◀',dd>0?osdW-20:6,tapeY+fs*1.5)}
      }
    }
    const pxPerRad=osdH/(camera.fov*D2R);
    o.save();
    o.translate(cx,osdH/2+e.x*pxPerRad);o.rotate(e.z);
    o.strokeStyle=white;o.lineWidth=1.5;
    o.beginPath();o.moveTo(-osdW*.7,0);o.lineTo(osdW*.7,0);o.stroke();
    o.lineWidth=1;
    for(const k of [-60,-45,-30,-15,15,30,45,60]){
      const y=(k*D2R-e.x)*pxPerRad;
      if(Math.abs(y)>osdH*.45)continue;
      const w=k%30===0?fs*2.4:fs*1.4;
      o.beginPath();o.moveTo(-w,y);o.lineTo(w,y);o.stroke();
      o.fillStyle='rgba(240,255,240,.7)';o.textAlign='left';
      o.fillText(String(-k),w+3,y);
    }
    o.restore();
    o.strokeStyle=white;o.lineWidth=1.5;
    o.beginPath();
    o.moveTo(cx-fs*.7,osdH/2);o.lineTo(cx-fs*.25,osdH/2);
    o.moveTo(cx+fs*.25,osdH/2);o.lineTo(cx+fs*.7,osdH/2);
    o.moveTo(cx,osdH/2-fs*.7);o.lineTo(cx,osdH/2-fs*.25);
    o.moveTo(cx,osdH/2+fs*.25);o.lineTo(cx,osdH/2+fs*.7);
    o.stroke();
    o.fillStyle=white;o.textAlign='left';
    o.fillText('THR',14,osdH*.2);
    o.strokeStyle='rgba(240,255,240,.5)';
    o.strokeRect(14,osdH*.2+fs*.6,fs*.55,osdH*.34);
    o.fillRect(14,osdH*.2+fs*.6+osdH*.34*(1-thr),fs*.55,osdH*.34*thr);
    o.fillText('ALT '+pos.y.toFixed(1)+'M',14,osdH*.68);
    o.fillText((vel.y>=0?'+':'')+vel.y.toFixed(1)+'M/S',14,osdH*.68+fs*1.3);
    o.textAlign='right';
    o.fillText('SPD '+(vel.length()*3.6).toFixed(0)+'KMH',osdW-14,osdH*.25);
    o.fillText(gameType==='bomber'?'TGT '+kills+'/50':'NO ORDNANCE',osdW-14,osdH*.25+fs*1.3);
    o.textAlign='center';
    const by=osdH-fs*2.2;
    if(gameType==='bomber'){
      if(battDead){o.fillStyle=red;o.fillText('** BATTERY DEAD **',cx,by)}
      else if(batt<25&&Math.floor(time*2)%2===0){o.fillStyle=red;o.fillText('LOW BATTERY',cx,by)}
    }
    if(!arm&&!dead){o.fillStyle=white;
      if(Math.floor(time*2)%2===0)o.fillText('DISARMED — ENTER / PAD-Y TO ARM',cx,by+fs*1.4)}
    if(gameType==='bomber'){
      o.fillStyle=white;
      o.fillText(dropCd>0?'BOMB RELOADING':'BOMB READY — SPACE / PAD-A',cx,osdH-fs*.9);
    }
    o.textAlign='left';
    for(let i=osdMsgs.length-1;i>=0;i--){
      const m=osdMsgs[i];m.life-=dt;
      if(m.life<=0){osdMsgs.splice(i,1);continue}
      o.fillStyle=`rgba(217,165,43,${clamp(m.life,0,1)})`;
      o.fillText(m.t,14,fs*(2.6+(osdMsgs.length-1-i)*1.4));
    }
    if(gameType==='bomber'){
      o.strokeStyle=amber;o.fillStyle=amber;
      for(const t of targets){
        if(t.dead)continue;
        const d=t.pos.distanceTo(pos);
        if(d>500)continue;
        tmpV2.set(t.pos.x,1.6,t.pos.z);
        if(toScreen(tmpV2)){
          const s=clamp(700/d,5,22);
          o.beginPath();
          o.moveTo(out.x,out.y-s);o.lineTo(out.x+s,out.y);
          o.lineTo(out.x,out.y+s);o.lineTo(out.x-s,out.y);
          o.closePath();o.stroke();
          o.textAlign='center';
          o.fillText(Math.round(d)+'M',out.x,out.y+s+fs*.8);
        }
      }
      if(arm&&!dead&&!ended){
        const t=(vel.y+Math.sqrt(vel.y*vel.y+2*9.81*Math.max(0,pos.y)))/9.81;
        tmpV2.set(pos.x+vel.x*t,0,pos.z+vel.z*t);
        if(toScreen(tmpV2)){
          o.strokeStyle=amber;o.lineWidth=1.5;
          o.beginPath();o.arc(out.x,out.y,10,0,7);o.stroke();
          o.beginPath();
          o.moveTo(out.x-14,out.y);o.lineTo(out.x-6,out.y);
          o.moveTo(out.x+6,out.y);o.lineTo(out.x+14,out.y);
          o.moveTo(out.x,out.y-14);o.lineTo(out.x,out.y-6);
          o.moveTo(out.x,out.y+6);o.lineTo(out.x,out.y+14);o.stroke();
        }
      }
    }
  }
  /* ---------- UI ---------- */
  function buildUI(){
    if($('#fpvwrap'))return;
    const w=document.createElement('div');
    w.id='fpvwrap';
    w.innerHTML=`
    <canvas id="fpvgl"></canvas>

    kills=0;bombsDropped=0;topSpd=0;shake=0;dropCd=0;groundedT=0;

  }
  function loop(t){
    if(!rafRunning)return;
    raf=requestAnimationFrame(loop);

    renderer.render(scene,camera);
  }
  /* ---------- boot FPV ---------- */
  buildUI();

  resize();
  window.__THEWAR_STATE__='ok';
  bootStep(100,'READY');
  $('#boot').classList.add('hidden');
  $('#fpvwrap').classList.add('on');
}

  /* ================= RAYCAST ================= */
  function rayAABB(ox,oy,oz,dx,dy,dz,b){
    let tmin=0,tmax=1e9;
    const ax=[[ox,dx,b.minx,b.maxx],[oy,dy,b.miny,b.maxy],[oz,dz,b.minz,b.maxz]];
    for(const [o,d,mn,mx] of ax){
      if(Math.abs(d)<1e-8){if(o<mn||o>mx)return null}
      else{
        let t1=(mn-o)/d,t2=(mx-o)/d;
        if(t1>t2){const t=t1;t1=t2;t2=t}
        tmin=Math.max(tmin,t1);tmax=Math.min(tmax,t2);
        if(tmin>tmax)return null;
      }
    }
    return tmin>0?tmin:(tmax>0?0:null);
  }
  function raySphere(ox,oy,oz,dx,dy,dz,cx,cy,cz,r){
    const lx=cx-ox,ly=cy-oy,lz=cz-oz;
    const tca=lx*dx+ly*dy+lz*dz;if(tca<0)return null;
    const d2=lx*lx+ly*ly+lz*lz-tca*tca,r2=r*r;
    if(d2>r2)return null;
    return tca-Math.sqrt(r2-d2);
  }
  function blockedBySolids(o,d,maxD){
    for(const b of solids){
      const t=rayAABB(o.x,o.y,o.z,d.x,d.y,d.z,b);
      if(t!==null&&t<maxD)return true;
    }
    return false;
  }
  function raycastShot(o,d,maxD=400){
    let best=null,bt=maxD;
    for(const b of solids){
      const t=rayAABB(o.x,o.y,o.z,d.x,d.y,d.z,b);
      if(t!==null&&t<bt){bt=t;best={kind:'world'}}
    }
    if(enemies)for(const e of enemies){
      if(e.dead)continue;
      const t=raySphere(o.x,o.y,o.z,d.x,d.y,d.z,e.pos.x,e.pos.y+1.62,e.pos.z,.27);
      if(t!==null&&t<bt){bt=t;best={kind:'enemy',e,part:'head'}}
      const b={minx:e.pos.x-.3,maxx:e.pos.x+.3,miny:e.pos.y,maxy:e.pos.y+1.52,minz:e.pos.z-.2,maxz:e.pos.z+.2};
      const tb=rayAABB(o.x,o.y,o.z,d.x,d.y,d.z,b);
      if(tb!==null&&tb<bt){bt=tb;best={kind:'enemy',e,part:'body'}}
    }
    for(const r of remotes.values()){
      if(!r.alive)continue;
      const b={minx:r.pos.x-.3,maxx:r.pos.x+.3,miny:r.pos.y,maxy:r.pos.y+1.52,minz:r.pos.z-.2,maxz:r.pos.z+.2};
      const t=rayAABB(o.x,o.y,o.z,d.x,d.y,d.z,b);
      if(t!==null&&t<bt){bt=t;best={kind:'remote',r}}
    }
    if(chase.cars)for(const c of chase.cars){
      const b={minx:c.pos.x-2.2,maxx:c.pos.x+2.2,miny:0,maxy:2.4,minz:c.pos.z-1.1,maxz:c.pos.z+1.1};
      const t=rayAABB(o.x,o.y,o.z,d.x,d.y,d.z,b);
      if(t!==null&&t<bt){bt=t;best={kind:'car',c}}

    GPD.mx=(gp.axes[0]||0)*mapStick([gp.axes[0]||0,gp.axes[1]||0]);

  let peerLoadPromise=null;
  function loadPeerJS(){
    if(typeof window.Peer==='function')return Promise.resolve(true);
    if(peerLoadPromise)return peerLoadPromise;
    const urls=[
      'https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js',
      'https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js'
    ];
    peerLoadPromise=new Promise(res=>{
      let i=0;
      const next=()=>{
        if(i>=urls.length){peerLoadPromise=null;res(false);return}
        const s=document.createElement('script');
        s.src=urls[i++];
        let done=false;
        const ok=()=>{if(done)return;done=true;res(typeof window.Peer==='function')};
        const fail=()=>{if(done)return;done=true;s.remove();next()};
        s.onload=ok;s.onerror=fail;
        setTimeout(fail,12000);
        document.head.appendChild(s);
      };
      next();
    });
    return peerLoadPromise;
  }
  function netReset(){

  }

  function onNet(c,d){
    if(!d||!d.h)return;
    switch(d.h){
      case 'hi':
        if(!remotes.has(c.peer))remotes.set(c.peer,new RemotePlayer(c.peer,d.name));
        netBroadcast({h:'r',ps:roster()});updateLobbyUI();
        break;
      case 'r':
        for(const p of d.ps){
          if(p[0]===myId())continue;
          if(!remotes.has(p[0]))remotes.set(p[0],new RemotePlayer(p[0],p[1]));
        }
        for(const id of [...remotes.keys()])
          if(!d.ps.find(p=>p[0]===id)){remotes.get(id).dispose();remotes.delete(id)}
        updateLobbyUI();
        break;
      case 'go':
        NET.mode=d.mode;NET.active=true;
        startGame(d.mode==='coop'?'mp-coop':'mp-pvp',{seed:d.seed});
        break;
      case 's':{
        let r=remotes.get(c.peer);
        if(!r){r=new RemotePlayer(c.peer,'SOLDIER');remotes.set(c.peer,r)}
        const p=d.p;r.setState(p[0],p[1],p[2],p[3],p[4],p[5],p[6]);
        if(NET.isHost)netBroadcast({h:'r',ps:roster()});
        break;
      }
      case 'snap':{
        for(const p of d.ps){
          if(p[0]===myId())continue;
          let r=remotes.get(p[0]);
          if(!r){r=new RemotePlayer(p[0],'SOLDIER');remotes.set(p[0],r)}
          r.setState(p[1],p[2],p[3],p[4],p[5],p[6],p[7]);
        }
        if(d.en&&enemies){
          for(const e of d.en)if(enemies[e[0]])enemies[e[0]].applySnap(e[1],e[2],e[3],e[4],e[5],e[6]);
        }
        killsGlobal=d.k;
        break;
      }
      case 'f':{
        const o=V3(d.o[0],d.o[1],d.o[2]),dir=V3(d.d[0],d.d[1],d.d[2]);
        tracer(o,o.clone().addScaledVector(dir,120));
        sfxFar(o.distanceTo(player.pos));
        if(NET.isHost){netBroadcast(d,c.peer);if(d.n)noiseAlert(o,d.n)}
        break;
      }
      case 'ed':
        if(NET.isHost&&enemies){
          const e=enemies[d.id];
          if(e&&!e.dead){e.damage(d.dmg,d.hs,d.by||'TEAM');if(e.hp<=0)netBroadcast({h:'ek',id:e.id,by:d.by||'TEAM'})}
        }
        break;
      case 'ek':
        if(enemies){const e=enemies[d.id];if(e&&!e.dead)e.die(d.by)}
        break;
      case 'ph':
        if(d.tgt===myId())takeDamage(d.dmg,V3(d.dir[0],d.dir[1],d.dir[2]),d.by);
        else if(NET.isHost)netBroadcast(d,c.peer);
        break;
      case 'd':{
        const r=remotes.get(d.id);
        if(r){
          r.alive=false;r.hp=0;
          killfeed(`${d.by||'?'} — ${r.name}`);
          if(d.by===S.name)player.kills++;
          if(NET.isHost)netBroadcast(d,c.peer);
          if(mode==='mp-pvp'&&NET.isHost){
            let winner=player.kills>=10?S.name:null;
            if(!winner)for(const rr of remotes.values())if(rr.kills>=10){winner=rr.name;break}
            if(winner){
              netBroadcast({h:'end',win:true,title:winner.toUpperCase()+' WINS',sub:'First to 10 confirmed kills.'});
              endGame(true,winner.toUpperCase()+' WINS','First to 10 confirmed kills.');
            }
          }
        }
        break;
      }
      case 'end':
        endGame(d.win,d.title,d.sub);
        break;
      case 'bye':
        removeConn(c.peer);
        break;
    }
  }

  function refreshPartStats(){
    const bars=[
      ['ACCURACY',clamp((.03-ST.spread)/.018,0,1)],
      ['CONTROL',clamp((1.25-ST.recoil)/.75,0,1)],
      ['MOBILITY',clamp((ST.mobility-.78)/.4,0,1)],
      ['STEALTH',clamp((170-ST.noise)/140,0,1)],
      ['MAGAZINE',ST.mag/45]
    ];
    $('#partstats').innerHTML=bars.map(b=>
      `<div class="statbar"><span>${b[0]}<b>${Math.round(b[1]*100)}</b></span><div class="tr"><i style="width:${(b[1]*100).toFixed(0)}%"></i></div></div>`
    ).join('')+`<div style="font-size:10px;color:var(--dim);letter-spacing:.14em;margin-top:8px">RESERVE ${ST.reserve} · NOISE RADIUS ${ST.noise} M</div>`;
  }
  function refreshSettings(){
    setv('i-name',S.name);
    for(const [i,p] of [['i-scale','renderScale',100],['i-dist','viewDist',1],['i-fov','fov',1],['i-sens','sens',1],
      ['i-range','stickRange',1],['i-dead','deadzone',1],['i-resp','response',1],['i-gpsens','gpSens',1],['i-vol','vol',1]])
      setv(i,Math.round(S[p]*(i==='i-scale'?100:1)));
    setc('i-shadows',S.shadows);
    setc('i-radar',S.radar);
    setc('i-fxlight',S.fxLight);
    setc('i-inv',S.invY);
    updateSetLabels();checkCustom();
  }
  function updateSetLabels(){
    sett('v-scale',Math.round(S.renderScale*100)+'%');
    sett('v-dist',S.viewDist+' M');
    sett('v-fov',S.fov+'°');
    sett('v-sens',S.sens+'%');
    sett('v-range',S.stickRange+'%');
    sett('v-dead',S.deadzone+'%');
    sett('v-resp',(S.response/100).toFixed(1)+'×');
    sett('v-gpsens',S.gpSens+'%');
    sett('v-vol',S.vol+'%');
  }
  function checkCustom(){
    let custom=true;
    for(const p of Object.keys(PRESETS)){
      const pre=PRESETS[p];
      if(pre.renderScale===S.renderScale&&pre.viewDist===S.viewDist&&pre.shadows===S.shadows&&
         pre.radar===S.radar&&pre.fxLight===S.fxLight){S.preset=p;custom=false;break}
    }
    if(custom)S.preset='custom';
    sett('customtag',custom?'· CUSTOM':'');
    $$('#presetseg button').forEach(b=>b.classList.toggle('on',b.dataset.p===S.preset));
    updateStatStrip();save();
  }
  function drawStickViz(){
    const x=$('#stickviz').getContext('2d');
    x.clearRect(0,0,150,150);
    x.strokeStyle='rgba(214,210,191,.25)';x.beginPath();x.arc(75,75,66,0,7);x.stroke();
    x.strokeStyle='rgba(217,154,43,.9)';x.beginPath();x.arc(75,75,66*(S.stickRange/100),0,7);x.stroke();
    x.strokeStyle='rgba(178,60,46,.8)';x.beginPath();x.arc(75,75,66*(S.deadzone/100),0,7);x.stroke();
    if(gpIndex>=0&&navigator.getGamepads){
      const gp=navigator.getGamepads()[gpIndex];
      if(gp){
        x.fillStyle='#e6e2cf';
        x.beginPath();x.arc(75+(gp.axes[2]||0)*66,75+(gp.axes[3]||0)*66,5,0,7);x.fill();
        return;
      }
    }
    x.fillStyle='rgba(139,136,115,.7)';x.font='10px "Share Tech Mono"';x.textAlign='center';
    x.fillText('NO GAMEPAD',75,140);
  }
  const mpStatus=t=>{const e=$('#mp-status');if(e)e.textContent=t};
  function showLobby(){
    $('#lobby').classList.remove('hidden');
    $('#mp-roomcode').textContent=NET.code;
    $('#mp-deploy').style.display=NET.isHost?'':'none';
    $$('#mp-mode button').forEach(b=>b.style.display=NET.isHost?'':'none');
    updateLobbyUI();mpStatus(NET.isHost?'ROOM OPEN — SHARE THE CODE':'CONNECTED');
  }
  function updateLobbyUI(){
    if($('#mpscreen').classList.contains('hidden'))return;
    const rows=[];
    if(NET.peer){
      rows.push(`<div>${S.name} ${NET.isHost?'<i>HOST</i>':''}</div>`);
      for(const r of remotes.values())rows.push(`<div>${r.name} <i>GUEST</i></div>`);
    }
    $('#mp-roster').innerHTML=rows.join('')||'<div style="color:var(--dim)">NO ROOM</div>';
  }
  function updateStatStrip(){
    sett('stat-q','QUALITY: '+(S.preset||'custom').toUpperCase());
    sett('stat-name','OPERATOR: '+(S.name||'SOLDIER').toUpperCase());
    sett('stat-gp','GAMEPAD: '+(gpIndex>=0?'CONNECTED':'—'));
    const g=$('#stat-gp');if(g)g.classList.toggle('on',gpIndex>=0);
    sett('stat-net',NET.peer?(NET.isHost?`NET: HOST · ${NET.code}`:`NET: P2P · ${NET.code}`):'NET: OFFLINE');
    const n=$('#stat-net');if(n)n.classList.toggle('on',!!NET.peer);
  }
  /* ================= QUALITY ================= */
  function applyQuality(){
    renderer.setPixelRatio(clamp(S.renderScale*Math.min(devicePixelRatio,2),.35,2));
    camera.far=Math.max(120,S.viewDist*1.9);
    camera.updateProjectionMatrix();
    scene.fog.near=S.viewDist*.22;
    scene.fog.far=S.viewDist;
    renderer.shadowMap.enabled=S.shadows;
    sun.castShadow=S.shadows;
    scene.traverse(o=>{if(o.material)o.material.needsUpdate=true});
    updateStatStrip();
  }
  /* ================= MAIN LOOP ================= */
  function onResize(){
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  }
  addEventListener('resize',onResize);
  let last=performance.now();
  function loop(now){
    requestAnimationFrame(loop);
    const dt=Math.min((now-last)/1000,.05);last=now;
    skyGroup.position.copy(camera.position);
    for(const m of smokePlanes){
      const u=m.userData.smoke;
      u.ph+=dt;
      m.position.y=u.y0+Math.sin(u.ph*u.sp)*3;
      m.quaternion.copy(camera.quaternion);
    }
    if(state==='menu'||state==='boot'){
      const t=now*.0001;
      camera.position.set(Math.sin(t)*60,10+Math.sin(t*2.3)*3,300+Math.cos(t*.7)*40);
      camera.lookAt(0,4,-60);
      if(camera.fov!==Math.min(S.fov,70)){camera.fov=Math.min(S.fov,70);camera.updateProjectionMatrix()}
      if(vm)vm.visible=false;
    }else{
      if(vm)vm.visible=true;
      if(state==='playing'&&(!paused||NET.active)){
        missionT+=dt;
        updatePlayer(dt);
        if(mode==='chase')updateChase(dt);
        if(enemies)for(const e of enemies)e.update(dt);
        updateRemotes(dt);
        netTick(dt);
        if(state==='playing')drawHUD(dt);
      }
    }
    if(S.shadows&&(state==='playing'||state==='menu')){
      const foc=state==='playing'?player.pos:camera.position;
      sun.position.set(foc.x-90,120,foc.z-60);
      sun.target.position.set(foc.x,0,foc.z);
    }
    updateFX(dt);
    if(!$('#settings').classList.contains('hidden'))drawStickViz();
    renderer.render(scene,camera);
  }
  /* ================= INIT + WIRING ================= */
  try{
    bootStep(85,'BUILDING BATTLEFIELD');
    buildWorld(1337);
    applyQuality();onResize();
    bootStep(94,'PREPARING SYSTEMS');
    buildLoadoutUI();refreshSettings();
    $('#modenav').addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      audioInit();sfxUI();sfxWind();
      const act=b.dataset.act;
      if(act==='searcher'){netReset();startGame('searcher')}
      else if(act==='chase'){netReset();startGame('chase')}
      else if(act==='mp'){$('#mp-name').value=S.name;$('#lobby').classList.add('hidden');showScreen('#mpscreen');updateStatStrip()}
      else if(act==='loadout'){briefOf('loadout');showScreen('#loadout')}
      else if(act==='settings'){briefOf('settings');settingsReturn='main';refreshSettings();showScreen('#settings')}
      else if(act==='fpv'){briefOf('fpv');history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>location.reload(),150)}
    });
    $('#modenav').addEventListener('mouseover',e=>{
      const b=e.target.closest('button');if(b&&BRIEFS[b.dataset.act])briefOf(b.dataset.act);
    });
    $$('[data-back]').forEach(b=>b.addEventListener('click',()=>{sfxUI();showScreen('#'+b.dataset.back)}));
    $$('#presetseg button').forEach(b=>b.addEventListener('click',()=>{
      Object.assign(S,PRESETS[b.dataset.p]);S.preset=b.dataset.p;
      refreshSettings();applyQuality();sfxUI();
    }));
    const bindRange=(inp,key,scale,cb)=>{
      const el=$(inp);if(!el)return;
      el.addEventListener('input',()=>{
        S[key]=el.value/scale;
        updateSetLabels();applyQuality();checkCustom();
        if(cb)cb();
      });
    };
    bindRange('#i-scale','renderScale',100);
    bindRange('#i-dist','viewDist',1);
    bindRange('#i-fov','fov',1);
    bindRange('#i-sens','sens',1);
    bindRange('#i-range','stickRange',1);
    bindRange('#i-dead','deadzone',1);
    bindRange('#i-resp','response',1);
    bindRange('#i-gpsens','gpSens',1);
    bindRange('#i-vol','vol',1,()=>{if(master)master.gain.value=S.vol/100});
    $('#i-shadows').addEventListener('change',e=>{S.shadows=e.target.checked;applyQuality();checkCustom()});
    $('#i-radar').addEventListener('change',e=>{S.radar=e.target.checked;
      $('#radar').style.display=S.radar&&mode!=='chase'?'block':'none';checkCustom()});
    $('#i-fxlight').addEventListener('change',e=>{S.fxLight=e.target.checked;checkCustom()});
    $('#i-inv').addEventListener('change',e=>{S.invY=e.target.checked;save()});
    $('#i-name').addEventListener('input',e=>{S.name=e.target.value||'SOLDIER';updateStatStrip();save()});
    $('#setback').addEventListener('click',()=>{
      sfxUI();
      showScreen(settingsReturn==='pause'?'#pause':'#main');
      if(settingsReturn==='pause')paused=true;
    });
    $('#mp-host').addEventListener('click',async()=>{
      S.name=$('#mp-name').value||'SOLDIER';save();sfxUI();
      mpStatus('LOADING P2P MODULE…');
      const ok=await loadPeerJS();
      if(!ok){mpStatus('P2P MODULE FAILED TO LOAD — CHECK CONNECTION');return}
      hostRoom();
    });
    $('#mp-join').addEventListener('click',async()=>{
      S.name=$('#mp-name').value||'SOLDIER';save();sfxUI();
      mpStatus('LOADING P2P MODULE…');
      const ok=await loadPeerJS();
      if(!ok){mpStatus('P2P MODULE FAILED TO LOAD — CHECK CONNECTION');return}
      joinRoom();
    });
    $$('#mp-mode button').forEach(b=>b.addEventListener('click',()=>{
      NET.mode=b.dataset.m;sfxUI();
      $$('#mp-mode button').forEach(x=>x.classList.toggle('on',x===b));
    }));
    $('#mp-deploy').addEventListener('click',()=>{
      if(!NET.isHost)return;
      const seed=(Math.random()*1e9)|0;
      netBroadcast({h:'go',mode:NET.mode,seed});
      NET.active=true;
      startGame(NET.mode==='coop'?'mp-coop':'mp-pvp',{seed});
    });
    $('#mp-name').addEventListener('input',e=>{S.name=e.target.value||'SOLDIER';save();updateStatStrip()});
    $('#btn-resume').addEventListener('click',()=>{sfxUI();togglePause()});
    $('#btn-pauseset').addEventListener('click',()=>{
      sfxUI();settingsReturn='pause';refreshSettings();
      $('#pause').classList.add('hidden');showScreen('#settings');
    });
    $('#btn-quit').addEventListener('click',()=>{
      sfxUI();
      if(NET.active)netBroadcast({h:'bye'});
      netReset();toMenu();
    });
    $('#btn-redeploy').addEventListener('click',()=>{sfxUI();startGame(mode)});
    $('#btn-endmenu').addEventListener('click',()=>{
      sfxUI();
      if(NET.active)netBroadcast({h:'bye'});
      netReset();toMenu();
    });
    window.__THEWAR_STATE__='ok';
    bootStep(100,'READY');
    requestAnimationFrame(loop);
    setTimeout(()=>{
      state='menu';
      briefOf('searcher');
      showScreen('#main');updateStatStrip();
    },350);
  }catch(err){
    console.error('[THE WAR] startup error:',err);
    bootFail('STARTUP ERROR: '+((err&&err.message)||err)+' — PRESS F12 FOR DETAILS');
  }
}
</script>
</body>
</html>
